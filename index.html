<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Programa SISTEDES multitrack</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="sprog-root" class="sprog">
    <h1 id="sprog-title" class="sprog-widget-title">Programa <span>SISTEDES</span></h1>
    <div class="sprog-actions" aria-label="Acciones del programa">
      <a class="sprog-button" href="#" data-sprog-home>Ver tabla general</a>
      <button class="sprog-button" type="button" onclick="window.print()">Imprimir</button>
    </div>
    <div class="sprog-note">Pulsa en un track de la tabla para abrir su programa detallado.</div>
    <section id="sprog-app" aria-live="polite"><div class="sprog-alert">Cargando programa...</div></section>
  </main>

  <script>
    (() => {
      const PROLE_ROOM = 'Aula Institucional / PROLE';
      const ROOM_LINKS = {
        'Aula 1.2': 'https://cvnet.cpd.ua.es/FichaAula/es/Aula/Ver/0101P2007',
        'Aula 1.1': 'https://cvnet.cpd.ua.es/FichaAula/es/Aula/Ver/0101P1003',
        'Aula Rafael Altamira': 'https://cvnet.cpd.ua.es/FichaAula/es/Aula/Ver/0101PB005',
        'Aula 2.2': 'https://cvnet.cpd.ua.es/FichaAula/es/Aula/Ver/0101P2001'
      };
      const TRACK_FILES = ['AI4SE', 'ASV', 'ICD', 'ISDM', 'ISGD', 'MCPS', 'METODOS', 'QUANTUM'];

      const app = document.getElementById('sprog-app');
      let config = null;
      let trackData = {};
      let trackById = {};

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function stripLinks(value) {
        return String(value ?? '')
          .replace(/<a\b[^>]*>(.*?)<\/a>/gis, '$1')
          .replace(/\[([^\]]+)\]\((?:[^)(]+|\([^)]*\))*\)/g, '$1');
      }

      function normalizeText(value) {
        return stripLinks(value).trim();
      }

      function roomLabel(room) {
        const label = escapeHtml(room);
        const url = ROOM_LINKS[room];
        return url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${label}</a>` : label;
      }

      function patchConfig(input) {
        const cfg = JSON.parse(JSON.stringify(input));
        cfg.rooms = (cfg.rooms || []).filter(room => room !== PROLE_ROOM);
        cfg.roomLinks = { ...(cfg.roomLinks || {}), ...ROOM_LINKS };
        if (cfg.roomAliases) {
          Object.keys(cfg.roomAliases).forEach(key => {
            if (cfg.roomAliases[key] === PROLE_ROOM || key === 'SALA E') delete cfg.roomAliases[key];
          });
        }
        (cfg.days || []).forEach(day => {
          day.rooms = (day.rooms || cfg.rooms || []).filter(room => room !== PROLE_ROOM);
          (day.rows || []).forEach(row => {
            if (Array.isArray(row.cells)) {
              row.cells = row.cells.filter(cell => cell && cell.room !== PROLE_ROOM);
            }
            removeVestibuloLink(row);
          });
        });
        return cfg;
      }

      function removeVestibuloLink(row) {
        if (!Array.isArray(row.links)) return;
        const before = row.links.length;
        row.links = row.links.filter(link => !(normalizeText(link.label).toLowerCase() === 'vestíbulo sede' && (!link.url || link.url === '#')));
        if (row.links.length !== before && row.label && !/Vestíbulo sede/i.test(row.label)) {
          row.label = `${row.label} · Vestíbulo sede`;
        }
        if (row.links.length === 0) delete row.links;
      }

      function daySortKey(dayName) {
        const text = String(dayName || '').toLowerCase();
        if (text.includes('martes') || text.includes('16')) return 16;
        if (text.includes('miércoles') || text.includes('miercoles') || text.includes('17')) return 17;
        if (text.includes('jueves') || text.includes('18')) return 18;
        return 99;
      }

      function hasTrackContent(sessions) {
        return Array.isArray(sessions) && sessions.some(session => {
          if (!session || typeof session !== 'object') return false;
          return Object.keys(session).some(key => key !== 'hora');
        });
      }

      function cleanTrackData(data) {
        const cleaned = {};
        Object.entries(data || {}).forEach(([day, sessions]) => {
          const cleanSessions = JSON.parse(JSON.stringify(sessions || []));
          cleanSessions.forEach(session => {
            Object.keys(session || {}).forEach(key => {
              if (typeof session[key] === 'string') session[key] = stripLinks(session[key]);
              if (Array.isArray(session[key])) {
                session[key].forEach(item => {
                  if (!item || typeof item !== 'object') return;
                  Object.keys(item).forEach(field => {
                    if (typeof item[field] === 'string') item[field] = stripLinks(item[field]);
                    if (Array.isArray(item[field])) item[field] = item[field].map(stripLinks);
                  });
                });
              }
            });
          });
          if (hasTrackContent(cleanSessions)) cleaned[stripLinks(day)] = cleanSessions;
        });
        return cleaned;
      }

      function renderLinks(links = []) {
        const safeLinks = links.filter(link => !(normalizeText(link.label).toLowerCase() === 'vestíbulo sede' && (!link.url || link.url === '#')));
        if (!safeLinks.length) return '';
        return `<div class="sprog-slot-links">${safeLinks.map(link => `<a href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(stripLinks(link.label))}</a>`).join('')}</div>`;
      }

      function renderCell(cell) {
        if (!cell) return '<td class="sprog-slot sprog-slot--empty"></td>';
        const cls = ['sprog-slot', cell.className || ''].filter(Boolean).join(' ');
        const parts = [];
        if (cell.label) parts.push(`<div class="sprog-slot-title">${escapeHtml(stripLinks(cell.label))}</div>`);
        if (Array.isArray(cell.tracks)) {
          parts.push(`<div class="sprog-track-links">${cell.tracks.map(id => {
            const track = trackById[id] || { short: id, className: '' };
            const className = ['sprog-track-link', track.className || ''].filter(Boolean).join(' ');
            return `<a class="${escapeHtml(className)}" href="#track-${escapeHtml(id)}">${escapeHtml(track.short || id)}</a>`;
          }).join('')}</div>`);
        }
        if (Array.isArray(cell.links)) parts.push(renderLinks(cell.links));
        return `<td class="${escapeHtml(cls)}">${parts.join('')}</td>`;
      }

      function renderGeneral() {
        document.getElementById('sprog-title').innerHTML = `${escapeHtml(config.title || 'Programa SISTEDES')}`;
        const html = (config.days || []).map(day => {
          const rooms = (day.rooms && day.rooms.length ? day.rooms : config.rooms || []).filter(room => room !== PROLE_ROOM);
          return `
            <section class="sprog-day" data-day="${escapeHtml(day.day)}">
              <h2 class="sprog-day-title">${escapeHtml(day.day)}</h2>
              <div class="sprog-table-wrap">
                <table class="sprog-table">
                  <thead>
                    <tr>
                      <th class="sprog-time-col">Hora</th>
                      ${rooms.map(room => `<th>${roomLabel(room)}</th>`).join('')}
                    </tr>
                  </thead>
                  <tbody>
                    ${(day.rows || []).map(row => renderGeneralRow(row, rooms)).join('')}
                  </tbody>
                </table>
              </div>
            </section>`;
        }).join('');
        app.innerHTML = html || '<div class="sprog-alert">No hay programa disponible.</div>';
      }

      function renderGeneralRow(row, rooms) {
        if (row.type === 'span') {
          const cls = ['sprog-slot', row.className || ''].filter(Boolean).join(' ');
          const links = renderLinks(row.links || []);
          return `<tr><th class="sprog-time">${escapeHtml(row.time || '')}</th><td class="${escapeHtml(cls)}" colspan="${rooms.length}"><div class="sprog-slot-title">${escapeHtml(stripLinks(row.label || ''))}</div>${links}</td></tr>`;
        }
        const cellsByRoom = new Map((row.cells || []).filter(cell => cell.room !== PROLE_ROOM).map(cell => [cell.room, cell]));
        return `<tr><th class="sprog-time">${escapeHtml(row.time || '')}</th>${rooms.map(room => renderCell(cellsByRoom.get(room))).join('')}</tr>`;
      }

      function currentTrackId() {
        const raw = decodeURIComponent(window.location.hash.replace(/^#/, ''));
        return raw.replace(/^track-/, '');
      }

      function renderTrack(trackId) {
        const track = trackById[trackId];
        const data = trackData[trackId] || {};
        if (!track) {
          renderGeneral();
          return;
        }
        const days = Object.entries(data).filter(([, sessions]) => hasTrackContent(sessions)).sort((a, b) => daySortKey(a[0]) - daySortKey(b[0]));
        document.getElementById('sprog-title').innerHTML = `${escapeHtml(track.short || track.id)} <span>${escapeHtml(track.name || '')}</span>`;
        app.innerHTML = `
          <section class="sprog-track-detail">
            <div class="sprog-track-meta">${track.room ? `Sala: ${roomLabel(track.room)}` : ''}</div>
            ${days.length ? days.map(([day, sessions]) => renderTrackDay(day, sessions)).join('') : '<div class="sprog-alert">No hay contenido específico para este track.</div>'}
          </section>`;
      }

      function renderTrackDay(day, sessions) {
        return `
          <section class="sprog-track-day" data-day="${escapeHtml(day)}">
            <h2 class="sprog-day-title">${escapeHtml(stripLinks(day))}</h2>
            <div class="sprog-table-wrap">
              <table class="sprog-table sprog-track-table">
                <thead><tr><th class="sprog-time-col">Hora</th><th>Sesión / Comunicaciones</th></tr></thead>
                <tbody>${sessions.map(renderTrackSession).join('')}</tbody>
              </table>
            </div>
          </section>`;
      }

      function renderTrackSession(session) {
        const hora = escapeHtml(session.hora || '');
        const blocks = Object.entries(session || {}).filter(([key]) => key !== 'hora').map(([title, papers]) => {
          const sessionTitle = escapeHtml(stripLinks(title));
          const items = Array.isArray(papers) && papers.length
            ? `<ol class="sprog-paper-list">${papers.map(paper => `<li><strong>${escapeHtml(stripLinks(paper.titulo || ''))}</strong>${Array.isArray(paper.autores) && paper.autores.length ? `<br><span>${escapeHtml(paper.autores.map(stripLinks).join(', '))}</span>` : ''}</li>`).join('')}</ol>`
            : '';
          return `<div class="sprog-session-block"><div class="sprog-slot-title">${sessionTitle}</div>${items}</div>`;
        }).join('');
        return `<tr><th class="sprog-time">${hora}</th><td>${blocks}</td></tr>`;
      }

      async function loadJson(url, fallback = null) {
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) {
          if (fallback !== null) return fallback;
          throw new Error(`No se pudo cargar ${url}`);
        }
        return response.json();
      }

      async function init() {
        try {
          config = patchConfig(await loadJson('data/programa-config.json'));
          trackById = Object.fromEntries((config.tracks || []).map(track => [track.id, track]));
          const trackResponses = await Promise.all(TRACK_FILES.map(async id => {
            try {
              return [id, cleanTrackData(await loadJson(`data/tracks/${id}.json`, {}))];
            } catch (error) {
              console.warn(error);
              return [id, {}];
            }
          }));
          trackData = Object.fromEntries(trackResponses);
          renderFromHash();
        } catch (error) {
          console.error(error);
          app.innerHTML = `<div class="sprog-alert">No se pudo cargar el programa. Revisa que existan los ficheros data/programa-config.json y data/tracks/*.json.</div>`;
        }
      }

      function renderFromHash() {
        const trackId = currentTrackId();
        if (trackId && trackById[trackId]) renderTrack(trackId);
        else renderGeneral();
      }

      document.querySelector('[data-sprog-home]').addEventListener('click', event => {
        event.preventDefault();
        history.pushState('', document.title, window.location.pathname + window.location.search);
        renderGeneral();
      });
      window.addEventListener('hashchange', renderFromHash);
      init();
    })();
  </script>
</body>
</html>

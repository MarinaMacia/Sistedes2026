<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Programa SISTEDES multitrack</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="sprog-root" class="sprog">
    <h1 id="sprog-title" class="sprog-widget-title">Programa <span>SISTEDES</span></h1>
    <div class="sprog-actions" aria-label="Acciones del programa">
      <a class="sprog-button" href="https://sistedes.lucentia.es/programa-cientifico-general/programa-jisbd/" target="_top" rel="noopener noreferrer">Volver al horario general de JISBD</a>
    </div>
    <div class="sprog-note">Pulsa en un track de la tabla para abrir su programa detallado.</div>
    <section id="sprog-app" aria-live="polite"><div class="sprog-alert">Cargando programa...</div></section>
  </main>

  <script>
    (() => {
      const app = document.getElementById('sprog-app');
      let config = null;
      let trackData = {};
      let trackById = {};

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function stripLinks(value) {
        return String(value ?? '')
          .replace(/<a\b[^>]*>(.*?)<\/a>/gis, '$1')
          .replace(/\[([^\]]+)\]\((?:[^)(]+|\([^)]*\))*\)/g, '$1');
      }

      function roomLabel(room) {
        const label = escapeHtml(room);
        const url = config.roomLinks?.[room];
        return url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${label}</a>` : label;
      }

      function daySortKey(dayName) {
        const text = String(dayName || '').toLowerCase();
        if (text.includes('martes') || text.includes('16')) return 16;
        if (text.includes('miércoles') || text.includes('miercoles') || text.includes('17')) return 17;
        if (text.includes('jueves') || text.includes('18')) return 18;
        return 99;
      }

      function hasTrackContent(sessions) {
        return Array.isArray(sessions) && sessions.some(session => {
          if (!session || typeof session !== 'object') return false;
          return Object.keys(session).some(key => key !== 'hora');
        });
      }

      function cleanTrackData(data) {
        const cleaned = {};
        Object.entries(data || {}).forEach(([day, sessions]) => {
          if (!hasTrackContent(sessions)) return;
          const cleanSessions = JSON.parse(JSON.stringify(sessions));
          cleanSessions.forEach(session => {
            Object.keys(session || {}).forEach(key => {
              if (typeof session[key] === 'string') session[key] = stripLinks(session[key]);
              if (Array.isArray(session[key])) {
                session[key].forEach(item => {
                  if (!item || typeof item !== 'object') return;
                  Object.keys(item).forEach(field => {
                    if (typeof item[field] === 'string') item[field] = stripLinks(item[field]);
                    if (Array.isArray(item[field])) item[field] = item[field].map(stripLinks);
                  });
                });
              }
            });
          });
          cleaned[stripLinks(day)] = cleanSessions;
        });
        return cleaned;
      }

      function renderLinks(links = []) {
        if (!links.length) return '';
        return `<div class="sprog-cell-links">${links.map(link => `<a href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(stripLinks(link.label))}</a>`).join('')}</div>`;
      }

      function renderCell(cell) {
        if (!cell) return '<td class="sprog-slot sprog-slot--empty"></td>';
        const inferredClass = Array.isArray(cell.tracks) && cell.tracks.length ? trackById[cell.tracks[0]]?.className : '';
        const className = ['sprog-slot', cell.className || inferredClass || ''].filter(Boolean).join(' ');
        const parts = [];
        if (cell.label) parts.push(`<span class="sprog-cell-group">${escapeHtml(stripLinks(cell.label))}</span>`);
        if (Array.isArray(cell.tracks)) {
          parts.push(`<span class="sprog-track">${cell.tracks.map(id => {
            const track = trackById[id] || { short: id };
            return `<a href="#track-${escapeHtml(id)}">${escapeHtml(track.short || id)}</a>`;
          }).join(' · ')}</span>`);
        }
        if (Array.isArray(cell.links)) parts.push(renderLinks(cell.links));
        return `<td class="${escapeHtml(className)}">${parts.join('')}</td>`;
      }

      function renderGeneralRow(row, rooms) {
        if (row.type === 'span') {
          const className = ['sprog-slot', row.className || ''].filter(Boolean).join(' ');
          const links = renderLinks(row.links || []);
          return `<tr class="sprog-general-row"><th class="sprog-time">${escapeHtml(row.time || '')}</th><td class="${escapeHtml(className)}" colspan="${rooms.length}"><span class="sprog-track">${escapeHtml(stripLinks(row.label || ''))}</span>${links}</td></tr>`;
        }
        const cellsByRoom = new Map((row.cells || []).map(cell => [cell.room, cell]));
        return `<tr><th class="sprog-time">${escapeHtml(row.time || '')}</th>${rooms.map(room => renderCell(cellsByRoom.get(room))).join('')}</tr>`;
      }

      function renderGeneral() {
        document.getElementById('sprog-title').innerHTML = `${escapeHtml(config.title || 'Programa SISTEDES')}`;
        app.innerHTML = (config.days || []).map(day => {
          const rooms = day.rooms && day.rooms.length ? day.rooms : config.rooms || [];
          return `
            <section class="sprog-day" data-day="${escapeHtml(day.day)}">
              <h2 class="sprog-day-title">${escapeHtml(day.day)}</h2>
              <div class="sprog-table-wrap">
                <table class="sprog-table">
                  <thead>
                    <tr>
                      <th class="sprog-time-col">Hora</th>
                      ${rooms.map(room => `<th>${roomLabel(room)}</th>`).join('')}
                    </tr>
                  </thead>
                  <tbody>${(day.rows || []).map(row => renderGeneralRow(row, rooms)).join('')}</tbody>
                </table>
              </div>
            </section>`;
        }).join('') || '<div class="sprog-alert">No hay programa disponible.</div>';
      }

      function currentTrackId() {
        const raw = decodeURIComponent(window.location.hash.replace(/^#/, ''));
        return raw.replace(/^track-/, '');
      }

      function renderTrack(trackId) {
        const track = trackById[trackId];
        const data = trackData[trackId] || {};
        if (!track) {
          renderGeneral();
          return;
        }
        const days = Object.entries(data)
          .filter(([, sessions]) => hasTrackContent(sessions))
          .sort((a, b) => daySortKey(a[0]) - daySortKey(b[0]));
        document.getElementById('sprog-title').innerHTML = `${escapeHtml(track.short || track.id)} <span>${escapeHtml(track.name || '')}</span>`;
        app.innerHTML = `
          <section class="sprog-track-detail">
            <div class="sprog-detail-head"><p>${track.room ? `Sala: ${roomLabel(track.room)}` : ''}</p></div>
            ${days.length ? days.map(([day, sessions]) => renderTrackDay(day, sessions)).join('') : '<div class="sprog-alert">No hay contenido específico para este track.</div>'}
          </section>`;
      }

      function renderTrackDay(day, sessions) {
        return `
          <section class="sprog-day sprog-track-day" data-day="${escapeHtml(day)}">
            <h2 class="sprog-day-title">${escapeHtml(stripLinks(day))}</h2>
            <div class="sprog-table-wrap">
              <table class="sprog-table sprog-track-table">
                <thead><tr><th class="sprog-time-col">Hora</th><th>Sesión / Comunicaciones</th></tr></thead>
                <tbody>${sessions.map(renderTrackSession).join('')}</tbody>
              </table>
            </div>
          </section>`;
      }

      function renderTrackSession(session) {
        const blocks = Object.entries(session || {}).filter(([key]) => key !== 'hora').map(([title, papers]) => {
          const items = Array.isArray(papers) && papers.length
            ? `<ol class="sprog-paper-list">${papers.map(paper => `<li class="sprog-paper-item"><span class="sprog-paper-title">${escapeHtml(stripLinks(paper.titulo || ''))}</span>${Array.isArray(paper.autores) && paper.autores.length ? `<span class="sprog-authors">${escapeHtml(paper.autores.map(stripLinks).join(', '))}</span>` : ''}</li>`).join('')}</ol>`
            : '';
          return `<div class="sprog-session-block"><span class="sprog-track--large">${escapeHtml(stripLinks(title))}</span>${items}</div>`;
        }).join('');
        return `<tr><th class="sprog-time">${escapeHtml(session.hora || '')}</th><td class="sprog-session-detail">${blocks}</td></tr>`;
      }

      async function loadJson(url) {
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error(`No se pudo cargar ${url}`);
        return response.json();
      }

      async function init() {
        try {
          config = await loadJson('data/programa-config.json');
          trackById = Object.fromEntries((config.tracks || []).map(track => [track.id, track]));
          const trackResponses = await Promise.all((config.tracks || []).map(async track => {
            try {
              return [track.id, cleanTrackData(await loadJson(track.file))];
            } catch (error) {
              console.warn(error);
              return [track.id, {}];
            }
          }));
          trackData = Object.fromEntries(trackResponses);
          renderFromHash();
        } catch (error) {
          console.error(error);
          app.innerHTML = `<div class="sprog-alert">No se pudo cargar el programa. Revisa que existan los ficheros de datos.</div>`;
        }
      }

      function renderFromHash() {
        const trackId = currentTrackId();
        if (trackId && trackById[trackId]) renderTrack(trackId);
        else renderGeneral();
      }

      window.addEventListener('hashchange', renderFromHash);
      init();
    })();
  </script>
</body>
</html>

}</script>

  <script>
    const CONFIG_URL = "data/programa-config.json";
    const app = document.getElementById("sprog-app");
    const title = document.getElementById("sprog-title");
    const fallbackConfig = JSON.parse(document.getElementById("sprog-fallback-config").textContent);
    const embeddedTrackData = JSON.parse(document.getElementById("sprog-embedded-track-data").textContent);
    const state = { config: null, tracks: [], sessions: [] };

    const SPANISH_WEEKDAYS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
    const SPANISH_MONTHS = { enero:1, febrero:2, marzo:3, abril:4, mayo:5, junio:6, julio:7, agosto:8, septiembre:9, setiembre:9, octubre:10, noviembre:11, diciembre:12 };

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    function normalizeText(value) {
      return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    }

    function compactTime(value) { return normalizeText(value).replace(/\s+/g, ""); }
    function normalizeTimeLabel(range) { return String(range || "").replace(/\s*-\s*/g, "-").trim(); }
    function displayTime(range) { return normalizeTimeLabel(range).replace(/-/g, "-"); }
    function timeStart(range) { const m = String(range || "").split("-")[0].trim().match(/(\d{1,2}):(\d{2})/); return m ? Number(m[1])*60 + Number(m[2]) : 99999; }
    function sameTime(a, b) { return compactTime(a) === compactTime(b); }
    function sameStart(a, b) { return timeStart(a) === timeStart(b); }
    function unique(values) { return [...new Set(values.filter(Boolean))]; }

    function canonicalDay(day) {
      const raw = String(day || "").trim();
      const normalized = normalizeText(raw);
      const monthName = Object.keys(SPANISH_MONTHS).find(name => normalized.includes(name));
      const month = monthName ? SPANISH_MONTHS[monthName] : (state.config?.month || 6);
      const yearMatch = normalized.match(/\b(20\d{2})\b/);
      const year = yearMatch ? Number(yearMatch[1]) : (state.config?.year || 2026);
      const numberMatch = normalized.match(/\b(\d{1,2})\b/);

      if (numberMatch) {
        const dayNumber = Number(numberMatch[1]);
        const date = new Date(Date.UTC(year, month - 1, dayNumber));
        const weekday = SPANISH_WEEKDAYS[date.getUTCDay()];
        const displayMonth = monthName ? monthName.charAt(0).toUpperCase() + monthName.slice(1) : "Junio";
        return `${weekday} ${dayNumber} de ${displayMonth}`;
      }

      const weekdayToDay = { lunes:15, martes:16, miercoles:17, jueves:18, viernes:19, sabado:20, domingo:21 };
      const weekdayKey = Object.keys(weekdayToDay).find(key => normalized.includes(key));
      if (weekdayKey) {
        const dayNumber = weekdayToDay[weekdayKey];
        const date = new Date(Date.UTC(year, month - 1, dayNumber));
        const weekday = SPANISH_WEEKDAYS[date.getUTCDay()];
        return `${weekday} ${dayNumber} de Junio`;
      }

      return raw;
    }

    function parseDaySort(day) { const m = normalizeText(day).match(/\b(\d{1,2})\b/); return m ? Number(m[1]) : 99; }

    async function fetchJson(url) {
      try {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } catch (error) {
        return null;
      }
    }

    function aliasRoom(room) {
      const raw = String(room || "").trim();
      const aliases = state.config?.roomAliases || {};
      const direct = aliases[raw];
      if (direct) return direct;
      const normalized = normalizeText(raw).toUpperCase();
      return aliases[normalized] || raw;
    }

    function parseSessionKey(key) {
      const pieces = String(key).split(/\s+-\s+/);
      const last = pieces[pieces.length - 1]?.trim() || "";
      const hasRoom = /^(sala|aula)\b/i.test(last);
      const room = hasRoom ? aliasRoom(last.toUpperCase()) : "";
      const titleText = hasRoom ? pieces.slice(0, -1).join(" - ").trim() : String(key).trim();
      const match = titleText.match(/ses[ií]ón\s*(\d+)/i);
      const number = match ? Number(match[1]) : null;
      return { title: titleText, room, number };
    }

    function getPaperAuthors(paper) {
      if (!paper) return "";
      if (Array.isArray(paper.autores)) {
        return paper.autores.map(author => {
          if (typeof author === "string") return author;
          if (author && typeof author === "object") return author.nombre || author.name || author.apellidos || "";
          return "";
        }).filter(Boolean).join(", ");
      }
      if (typeof paper.autores === "string") return paper.autores.trim();
      return "";
    }

    function flattenTrack(track, data) {
      const sessions = [];
      let fallbackNumber = 0;
      Object.entries(data || {}).forEach(([day, entries]) => {
        (entries || []).forEach(entry => {
          const time = normalizeTimeLabel(entry.hora || "");
          Object.entries(entry).forEach(([key, value]) => {
            if (key === "hora" || !Array.isArray(value)) return;
            fallbackNumber += 1;
            const parsed = parseSessionKey(key);
            const code = parsed.number ? `S${parsed.number}` : `S${fallbackNumber}`;
            sessions.push({
              id: `${track.id}-${code}`,
              trackId: track.id,
              trackShort: track.short || track.id,
              trackName: track.name || track.id,
              trackClass: track.className || "",
              code,
              day: canonicalDay(day),
              originalDay: day,
              time,
              title: parsed.title,
              room: parsed.room || aliasRoom(track.room) || "Sala pendiente",
              papers: value
            });
          });
        });
      });
      return sessions;
    }

    async function init() {
      const loadedConfig = await fetchJson(CONFIG_URL);
      state.config = loadedConfig || fallbackConfig;
      title.innerHTML = `${escapeHtml(state.config.title || "Programa")} <span>${escapeHtml(state.config.subtitle || "")}</span>`;

      const tracks = [];
      const allSessions = [];
      for (const track of (state.config.tracks || [])) {
        let data = await fetchJson(track.file);
        if (!data && embeddedTrackData[track.id]) data = embeddedTrackData[track.id];
        const sessions = data ? flattenTrack(track, data) : [];
        tracks.push({ ...track, loaded: Boolean(data), sessions });
        allSessions.push(...sessions);
      }
      state.tracks = tracks;
      state.sessions = allSessions;
      route();
    }

    function getTrack(trackId) { return state.tracks.find(track => track.id === trackId); }

    function findSession(trackId, day, time) {
      const cday = canonicalDay(day);
      return state.sessions.find(s => s.trackId === trackId && s.day === cday && sameTime(s.time, time))
        || state.sessions.find(s => s.trackId === trackId && s.day === cday && sameStart(s.time, time))
        || state.sessions.find(s => s.trackId === trackId && sameTime(s.time, time))
        || state.sessions.find(s => s.trackId === trackId && sameStart(s.time, time));
    }

    function renderLinks(links) {
      if (!Array.isArray(links) || !links.length) return "";
      return `<span class="sprog-meta">${links.map(link => `<a href="${escapeHtml(link.url || '#')}" target="_blank" rel="noopener">${escapeHtml(link.label || link.url || '')}</a>`).join(" · ")}</span>`;
    }

    function renderCell(cell, day, time) {
      if (!cell) return `<td class="sprog-slot--empty"></td>`;
      const tracks = cell.tracks || [];
      const cls = cell.className || (tracks[0] ? (getTrack(tracks[0])?.className || "sprog-slot--jisbd") : "sprog-slot--empty");

      if (tracks.length) {
        const links = tracks.map((trackId, index) => {
          const track = getTrack(trackId);
          const session = findSession(trackId, day, time);
          const href = session ? `#${session.id}` : `#${trackId}`;
          const joiner = index < tracks.length - 1 ? `<span aria-hidden="true">+</span>` : "";
          return `<a href="${escapeHtml(href)}" title="${escapeHtml(track?.name || trackId)}">${escapeHtml(track?.short || trackId)}</a>${joiner}`;
        }).join("");
        return `<td class="${escapeHtml(cls)}"><span class="sprog-cell-group">${escapeHtml(cell.group || '')}</span><span class="sprog-cell-links">${links}</span></td>`;
      }

      if (cell.label) {
        return `<td class="${escapeHtml(cls)}"><span class="sprog-cell-group">${escapeHtml(cell.group || cell.label || '')}</span>${renderLinks(cell.links)}</td>`;
      }

      return `<td class="${escapeHtml(cls)}"></td>`;
    }

    function renderSpanRow(row, roomCount) {
      return `
        <tr class="sprog-general-row">
          <th class="sprog-time" scope="row">${escapeHtml(displayTime(row.time || ''))}</th>
          <td class="${escapeHtml(row.className || 'sprog-slot--general-light')}" colspan="${roomCount}">
            <span class="sprog-track">${escapeHtml(row.label || '')}</span>
            ${renderLinks(row.links)}
          </td>
        </tr>`;
    }

    function renderSummary() {
      const days = state.config.days || [];
      app.innerHTML = days.map(dayCfg => {
        const rooms = dayCfg.rooms || state.config.rooms || [];
        const rows = dayCfg.rows || [];
        return `
          <section class="sprog-day">
            <h2 class="sprog-day-title">${escapeHtml(canonicalDay(dayCfg.day))} <span>· ${escapeHtml(dayCfg.location || state.config.subtitle || '')}</span></h2>
            <div class="sprog-table-wrap">
              <table class="sprog-table">
                <thead><tr><th scope="col"><span class="sprog-head-main">Hora / Lugar</span></th>${rooms.map(room => `<th scope="col"><span class="sprog-head-main"><a href="#">${escapeHtml(room)}</a></span></th>`).join('')}</tr></thead>
                <tbody>
                  ${rows.map(row => {
                    if (row.type === 'span') return renderSpanRow(row, rooms.length);
                    const cellsByRoom = new Map((row.cells || []).map(cell => [cell.room, cell]));
                    return `<tr><th class="sprog-time" scope="row">${escapeHtml(displayTime(row.time || ''))}</th>${rooms.map(room => renderCell(cellsByRoom.get(room), dayCfg.day, row.time)).join('')}</tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </section>`;
      }).join('');
    }

    function commonRowsForDay(day) {
      const dayCfg = (state.config.days || []).find(d => canonicalDay(d.day) === day);
      return (dayCfg?.rows || [])
        .filter(row => row.type === 'span')
        .map(row => ({ type: 'common', time: normalizeTimeLabel(row.time), label: row.label, className: row.className, links: row.links }));
    }

    function renderTrackDetail(trackId, focusSessionId = null) {
      const track = getTrack(trackId);
      if (!track) return renderSummary();
      if (!track.loaded || !track.sessions.length) {
        app.innerHTML = `<section class="sprog--detail"><div class="sprog-detail-head"><h2>${escapeHtml(track.short || track.id)}</h2><p>No se ha cargado el programa de este track.</p></div></section>`;
        return;
      }

      const sessions = [...track.sessions].sort((a,b) => parseDaySort(a.day)-parseDaySort(b.day) || timeStart(a.time)-timeStart(b.time));
      const days = unique([ ...sessions.map(s => s.day), ...(state.config.days || []).map(d => canonicalDay(d.day)) ]).sort((a,b)=>parseDaySort(a)-parseDaySort(b));

      app.innerHTML = `
        <section class="sprog--detail">
          <header class="sprog-detail-head">
            <h2>${escapeHtml(track.short || track.id)} · ${escapeHtml(track.name || track.id)}</h2>
            <p>Programa detallado del track</p>
            <nav class="sprog-session-nav" aria-label="Sesiones del track">
              ${sessions.map(session => `<a href="#${escapeHtml(session.id)}">${escapeHtml(session.day)} · ${escapeHtml(displayTime(session.time))}</a>`).join('')}
            </nav>
          </header>
          ${days.map(day => renderDetailDay(track, day)).join('')}
        </section>`;

      if (focusSessionId) requestAnimationFrame(() => document.getElementById(focusSessionId)?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
    }

    function renderDetailDay(track, day) {
      const sessionRows = track.sessions.filter(s => s.day === day).map(s => ({ type:'session', time:s.time, session:s }));
      const commonRows = commonRowsForDay(day);
      const rows = [...sessionRows, ...commonRows].sort((a,b) => timeStart(a.time)-timeStart(b.time) || (a.type === 'common' ? -1 : 1));
      if (!rows.length) return '';
      return `
        <section class="sprog-day">
          <h3 class="sprog-day-title">${escapeHtml(day)}</h3>
          <div class="sprog-table-wrap">
            <table class="sprog-table"><tbody>${rows.map(row => row.type === 'common' ? renderDetailCommonRow(row) : renderSessionRow(row.session)).join('')}</tbody></table>
          </div>
        </section>`;
    }

    function renderDetailCommonRow(row) {
      return `<tr class="sprog-general-row"><th class="sprog-time" scope="row">${escapeHtml(displayTime(row.time))}</th><td class="sprog-session-detail ${escapeHtml(row.className || 'sprog-slot--general-light')}"><span class="sprog-track--large">${escapeHtml(row.label || '')}</span>${renderLinks(row.links)}</td></tr>`;
    }

    function renderSessionRow(session) {
      const papers = session.papers || [];
      return `
        <tr id="${escapeHtml(session.id)}">
          <th class="sprog-time" scope="row">${escapeHtml(displayTime(session.time))}</th>
          <td class="sprog-session-detail">
            <span class="sprog-track--large">${escapeHtml(session.title)}</span>
            <span class="sprog-meta">${escapeHtml(session.room || '')}</span>
            ${papers.length ? `<div class="sprog-paper-list">${papers.map(paper => {
              const authors = getPaperAuthors(paper);
              return `<div class="sprog-paper-item"><span class="sprog-paper-title">${escapeHtml(paper.titulo || 'Sin título')}</span>${authors ? `<span class="sprog-authors">${escapeHtml(authors)}</span>` : ''}</div>`;
            }).join('')}</div>` : ''}
          </td>
        </tr>`;
    }

    function route() {
      const hash = decodeURIComponent(window.location.hash.replace(/^#/, ''));
      if (!hash) return renderSummary();
      const session = state.sessions.find(s => s.id === hash);
      if (session) return renderTrackDetail(session.trackId, session.id);
      const track = getTrack(hash);
      if (track) return renderTrackDetail(track.id);
      renderSummary();
    }

    document.querySelector('[data-sprog-home]')?.addEventListener('click', event => {
      event.preventDefault();
      history.pushState('', document.title, window.location.pathname + window.location.search);
      renderSummary();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    window.addEventListener('hashchange', route);
    init();
  </script>
</body>
</html>
